<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>⚡ 30-Min Workout Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans pb-24">

  <div class="max-w-md mx-auto p-4 space-y-4">
    <!-- Header -->
    <header class="text-center py-1 border-b border-gray-800">
      <h1 class="text-2xl font-bold text-amber-400">⚡ 30-Min Workout Tracker</h1>
      <p id="status-bar" class="text-xs text-gray-400 mt-1">Connecting to database...</p>
    </header>

    <!-- Routine Configuration Controls -->
    <section class="bg-gray-800 p-3 rounded-xl shadow space-y-2 border border-gray-700">
      <div>
        <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Split Day</label>
        <select id="split-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-400" onchange="loadWorkoutTemplate()">
          <option value="Upper A (Chest / Back / Shoulders / Arms)">Upper A (Chest / Back / Shoulders / Arms)</option>
          <option value="Lower A (Quads / Hamstrings / Glutes / Calves)">Lower A (Quads / Hamstrings / Glutes / Calves)</option>
          <option value="Upper B (Chest / Back / Shoulders / Arms)">Upper B (Chest / Back / Shoulders / Arms)</option>
          <option value="Lower B (Quads / Hamstrings / Glutes / Core)">Lower B (Quads / Hamstrings / Glutes / Core)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Option</label>
          <select id="option-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-400" onchange="loadWorkoutTemplate()">
            <option value="Option 1">Option 1</option>
            <option value="Option 2">Option 2</option>
            <option value="Option 3">Option 3</option>
            <option value="Option 4">Option 4</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Environment</label>
          <select id="env-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-400" onchange="loadWorkoutTemplate()">
            <option value="Gym">Gym</option>
            <option value="Home">Home</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Multi-Screen Tab Bar Navigation -->
    <nav id="tabs-header" class="flex space-x-1 overflow-x-auto pb-1 scrollbar-none"></nav>

    <!-- Active Exercise Screen Container -->
    <main id="active-screen-container"></main>

    <!-- Bottom Navigation Controls -->
    <footer class="flex justify-between items-center gap-2 pt-2 border-t border-gray-800">
      <button onclick="prevExercise()" class="w-1/3 bg-gray-800 hover:bg-gray-700 text-gray-200 py-3 rounded-xl font-medium border border-gray-700 text-sm">
        ⬅️ Prev
      </button>
      <button onclick="nextExercise()" class="w-1/3 bg-gray-800 hover:bg-gray-700 text-gray-200 py-3 rounded-xl font-medium border border-gray-700 text-sm">
        Next ➔
      </button>
      <button onclick="saveSession()" class="w-1/3 bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-3 rounded-xl shadow-lg text-sm">
        💾 Save
      </button>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = "https://wxpgpaepvkbieryeihpb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SryrkBABso8FvXuL_GFweQ_quSoLeXw";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const EXERCISE_ALTERNATIVES = {
      "Barbell Bench Press": ["Dumbbell Flat Bench Press", "Plate-Loaded Machine Chest Press"],
      "Seated Machine Row": ["Chest-Supported Dumbbell Row", "T-Bar Row"],
      "Standing Overhead Barbell Press": ["Seated Dumbbell Overhead Press", "Machine Shoulder Press"],
      "Incline Machine Chest Press": ["Incline Dumbbell Press", "Incline Smith Machine Press"],
      "Plate-Loaded Machine Chest Press": ["Barbell Bench Press", "Dumbbell Flat Bench Press"],
      "Incline Dumbbell Press": ["Incline Machine Chest Press", "Incline Smith Machine Press"],
      "Heavy Lat Pulldown": ["Seated Cable Row", "Neutral Grip Pulldown"],
      "Neutral-Grip Lat Pulldown": ["Heavy Lat Pulldown", "Seated Cable Row"],
      "Seated DB Overhead Press": ["Standing Overhead Barbell Press", "Machine Shoulder Press"],
      "Machine Shoulder Press": ["Standing Overhead Barbell Press", "Seated DB Overhead Press"],
      "Dumbbell Arnold Press": ["Seated Dumbbell Shoulder Press", "Machine Shoulder Press"],
      "Seated Cable Row": ["Single-Arm Machine Row", "Chest-Supported Dumbbell Row"],
      "Single-Arm Machine Row": ["Seated Cable Row", "T-Bar Row"],
      "Barbell Back Squat": ["Smith Machine Squat", "Goblet Squat"],
      "Barbell Front Squat": ["Goblet Squat", "Hack Squat Machine"],
      "Romanian Deadlift (Barbell)": ["Dumbbell Romanian Deadlift", "Single-Leg DB RDL"],
      "Hack Squat Machine": ["Leg Press Machine", "Pendulum Squat"],
      "Barbell Deadlift": ["Trap Bar Deadlift", "Barbell Rack Pull"],
      "Machine Chest Fly (Pec Deck)": ["Cable Chest Fly", "Dumbbell Fly"],
      "Cable Chest Fly": ["Machine Chest Fly (Pec Deck)", "Dumbbell Fly"],
      "Machine Rear Delt Fly (Reverse Pec Deck)": ["Cable Face Pull", "High Cable Rear Delt Fly"],
      "Cable Face Pull": ["Machine Rear Delt Fly", "Dumbbell Rear Delt Fly"],
      "Cable Lateral Raise": ["Dumbbell Lateral Raise", "Machine Lateral Raise"],
      "Dumbbell Lateral Raise": ["Cable Lateral Raise", "Machine Lateral Raise"],
      "Cable Tricep Pushdown": ["Rope Tricep Extension", "Lying Tricep Extension"],
      "Overhead Cable Tricep Extension": ["Overhead Dumbbell Tricep Extension", "EZ-Bar Skullcrushers"],
      "Cable Bicep Curl": ["Dumbbell Bicep Curl", "EZ-Bar Preacher Curl"],
      "Incline Dumbbell Bicep Curl": ["Cable Bicep Curl", "Concentration Curls"],
      "Dumbbell Hammer Curl": ["Cable Rope Hammer Curl", "Cross-Body Hammer Curl"],
      "Cable Rope Hammer Curl": ["Dumbbell Hammer Curl", "Reverse Grip EZ-Bar Curl"],
      "Hip Abductor Machine": ["Standing Cable Hip Abduction", "Band Clamshells"],
      "Hip Adductor Machine": ["Cable Adduction", "Sumo Squat Hold"],
      "Leg Press Machine": ["Hack Squat Machine", "Goblet Squat"],
      "Leg Extension Machine": ["Sissy Squat", "Band Leg Extension"],
      "Seated Leg Curl Machine": ["Lying Leg Curl Machine", "Swiss Ball Curl"],
      "Lying Leg Curl Machine": ["Seated Leg Curl Machine", "Standing Leg Curl"],
      "Standing Calf Raise (Machine)": ["Seated Calf Raise (Machine)", "Leg Press Calf Press"],
      "Seated Calf Raise (Machine)": ["Standing Calf Raise (Machine)", "Leg Press Calf Press"],
      "Heavy Cable Crunch": ["Hanging Leg Raise", "Weighted Decline Crunch"],
      "Hanging Leg Raise": ["Lying Leg Raise", "Captain's Chair Knee Raise"]
    };

    const SUGGESTED_EXTRA_EXERCISES = [
      "Cable Lateral Raise", "Dumbbell Lateral Raise", "Cable Face Pull",
      "Machine Rear Delt Fly (Reverse Pec Deck)", "Cable Bicep Curl",
      "Dumbbell Hammer Curl", "Cable Tricep Pushdown", "Overhead Cable Tricep Extension",
      "Heavy Cable Crunch", "Hanging Leg Raise", "Seated Calf Raise (Machine)",
      "Leg Extension Machine", "Hip Abductor Machine"
    ];

    // Paced/Interleaved Workout Templates (Push -> Pull -> Isolation -> Antagonist)
    const WORKOUT_TEMPLATES = {
      "Upper A (Chest / Back / Shoulders / Arms)": {
        "Gym": {
          "Option 1": { lifts: [{name:"Barbell Bench Press", sets:4, reps:"3-5", isComp:true}, {name:"Seated Machine Row", sets:4, reps:"3-5", isComp:true}, {name:"Machine Chest Fly (Pec Deck)", sets:3, reps:"8-12", isComp:false}, {name:"Cable Bicep Curl", sets:3, reps:"8-12", isComp:false}] },
          "Option 2": { lifts: [{name:"Incline Dumbbell Press", sets:4, reps:"3-5", isComp:true}, {name:"Heavy Lat Pulldown", sets:4, reps:"3-5", isComp:true}, {name:"Cable Lateral Raise", sets:3, reps:"8-12", isComp:false}, {name:"Incline Dumbbell Bicep Curl", sets:3, reps:"8-12", isComp:false}] },
          "Option 3": { lifts: [{name:"Plate-Loaded Machine Chest Press", sets:4, reps:"3-5", isComp:true}, {name:"Single-Arm Machine Row", sets:4, reps:"3-5", isComp:true}, {name:"Machine Rear Delt Fly (Reverse Pec Deck)", sets:3, reps:"8-12", isComp:false}, {name:"Dumbbell Hammer Curl", sets:3, reps:"8-12", isComp:false}] },
          "Option 4": { lifts: [{name:"Incline Machine Chest Press", sets:4, reps:"3-5", isComp:true}, {name:"Seated Cable Row", sets:4, reps:"3-5", isComp:true}, {name:"Cable Chest Fly", sets:3, reps:"8-12", isComp:false}, {name:"Cable Rope Hammer Curl", sets:3, reps:"8-12", isComp:false}] }
        }
      },
      "Lower A (Quads / Hamstrings / Glutes / Calves)": {
        "Gym": {
          "Option 1": { lifts: [{name:"Barbell Back Squat", sets:4, reps:"3-5", isComp:true}, {name:"Romanian Deadlift (Barbell)", sets:3, reps:"5-8", isComp:true}, {name:"Leg Press Machine", sets:3, reps:"8-12", isComp:false}, {name:"Hip Abductor Machine", sets:3, reps:"10-12", isComp:false}] },
          "Option 2": { lifts: [{name:"Hack Squat Machine", sets:4, reps:"3-5", isComp:true}, {name:"Romanian Deadlift (Barbell)", sets:3, reps:"5-8", isComp:true}, {name:"Leg Extension Machine", sets:3, reps:"8-12", isComp:false}, {name:"Standing Calf Raise (Machine)", sets:3, reps:"8-12", isComp:false}] },
          "Option 3": { lifts: [{name:"Barbell Back Squat", sets:4, reps:"3-5", isComp:true}, {name:"Romanian Deadlift (Barbell)", sets:3, reps:"5-8", isComp:true}, {name:"Seated Leg Curl Machine", sets:3, reps:"8-12", isComp:false}, {name:"Hip Abductor Machine", sets:3, reps:"10-12", isComp:false}] },
          "Option 4": { lifts: [{name:"Hack Squat Machine", sets:4, reps:"3-5", isComp:true}, {name:"Barbell Deadlift", sets:3, reps:"3-5", isComp:true}, {name:"Lying Leg Curl Machine", sets:3, reps:"8-12", isComp:false}, {name:"Seated Calf Raise (Machine)", sets:3, reps:"8-12", isComp:false}] }
        }
      },
      "Upper B (Chest / Back / Shoulders / Arms)": {
        "Gym": {
          "Option 1": { lifts: [{name:"Standing Overhead Barbell Press", sets:4, reps:"3-5", isComp:true}, {name:"Seated Cable Row", sets:4, reps:"3-5", isComp:true}, {name:"Cable Chest Fly", sets:3, reps:"8-12", isComp:false}, {name:"Cable Tricep Pushdown", sets:3, reps:"8-12", isComp:false}] },
          "Option 2": { lifts: [{name:"Seated DB Overhead Press", sets:4, reps:"3-5", isComp:true}, {name:"Heavy Lat Pulldown", sets:4, reps:"3-5", isComp:true}, {name:"Dumbbell Lateral Raise", sets:3, reps:"8-12", isComp:false}, {name:"Overhead Cable Tricep Extension", sets:3, reps:"8-12", isComp:false}] },
          "Option 3": { lifts: [{name:"Machine Shoulder Press", sets:4, reps:"3-5", isComp:true}, {name:"Single-Arm Machine Row", sets:4, reps:"3-5", isComp:true}, {name:"Machine Rear Delt Fly (Reverse Pec Deck)", sets:3, reps:"8-12", isComp:false}, {name:"Cable Tricep Pushdown", sets:3, reps:"8-12", isComp:false}] },
          "Option 4": { lifts: [{name:"Dumbbell Arnold Press", sets:4, reps:"3-5", isComp:true}, {name:"Neutral-Grip Lat Pulldown", sets:4, reps:"3-5", isComp:true}, {name:"Cable Face Pull", sets:3, reps:"8-12", isComp:false}, {name:"Overhead Cable Tricep Extension", sets:3, reps:"8-12", isComp:false}] }
        }
      },
      "Lower B (Quads / Hamstrings / Glutes / Core)": {
        "Gym": {
          "Option 1": { lifts: [{name:"Barbell Deadlift", sets:3, reps:"3-5", isComp:true}, {name:"Hack Squat Machine", sets:3, reps:"5-8", isComp:true}, {name:"Hip Adductor Machine", sets:3, reps:"10-12", isComp:false}, {name:"Heavy Cable Crunch", sets:3, reps:"8-12", isComp:false}] },
          "Option 2": { lifts: [{name:"Barbell Front Squat", sets:3, reps:"5-8", isComp:true}, {name:"Romanian Deadlift (Barbell)", sets:3, reps:"5-8", isComp:true}, {name:"Leg Press Machine", sets:3, reps:"8-12", isComp:false}, {name:"Seated Calf Raise (Machine)", sets:3, reps:"8-12", isComp:false}] },
          "Option 3": { lifts: [{name:"Barbell Deadlift", sets:3, reps:"3-5", isComp:true}, {name:"Leg Press Machine", sets:3, reps:"5-8", isComp:true}, {name:"Hip Adductor Machine", sets:3, reps:"10-12", isComp:false}, {name:"Seated Leg Curl Machine", sets:3, reps:"8-12", isComp:false}] },
          "Option 4": { lifts: [{name:"Barbell Front Squat", sets:3, reps:"5-8", isComp:true}, {name:"Hack Squat Machine", sets:3, reps:"5-8", isComp:true}, {name:"Lying Leg Curl Machine", sets:3, reps:"8-12", isComp:false}, {name:"Hanging Leg Raise", sets:3, reps:"8-12", isComp:false}] }
        }
      }
    };

    let historyLogs = [];
    let currentSessionLifts = [];
    let activeExerciseIdx = 0;

    async function initApp() {
      try {
        const { data, error } = await supabaseClient
          .from('workout_logs')
          .select('*')
          .order('workout_date', { ascending: false });

        if (error) throw error;
        historyLogs = data || [];
        document.getElementById('status-bar').innerText = `⚡ Connected | ${historyLogs.length} Sessions Logged`;
        loadWorkoutTemplate();
      } catch (err) {
        document.getElementById('status-bar').innerText = `⚠️ Connection Error: ${err.message}`;
      }
    }

    function loadWorkoutTemplate() {
      const split = document.getElementById('split-select').value;
      const option = document.getElementById('option-select').value;
      const env = document.getElementById('env-select').value;

      const template = WORKOUT_TEMPLATES[split]?.[env]?.[option] || WORKOUT_TEMPLATES[split]?.["Gym"]?.[option];
      if (template) {
        currentSessionLifts = JSON.parse(JSON.stringify(template.lifts));
        activeExerciseIdx = 0;
        renderTabsAndScreen();
      }
    }

    function renderTabsAndScreen() {
      const tabsHeader = document.getElementById('tabs-header');
      tabsHeader.innerHTML = '';

      // Render Exercise Screen Tabs
      currentSessionLifts.forEach((lift, idx) => {
        const btn = document.createElement('button');
        btn.onclick = () => { activeExerciseIdx = idx; renderTabsAndScreen(); };
        btn.className = `px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap transition ${
          activeExerciseIdx === idx
            ? 'bg-amber-400 text-gray-900 shadow-md'
            : 'bg-gray-800 text-gray-400 hover:bg-gray-700 border border-gray-700'
        }`;
        btn.innerText = `Ex ${idx + 1}: ${lift.name.split(' ')[0]}`;
        tabsHeader.appendChild(btn);
      });

      // Render "+ Add" Tab
      const addBtn = document.createElement('button');
      addBtn.onclick = () => { activeExerciseIdx = currentSessionLifts.length; renderTabsAndScreen(); };
      addBtn.className = `px-3 py-1.5 text-xs font-bold rounded-lg whitespace-nowrap transition ${
        activeExerciseIdx === currentSessionLifts.length
          ? 'bg-amber-400 text-gray-900 shadow-md'
          : 'bg-gray-800 text-amber-400 hover:bg-gray-700 border border-amber-500/40'
      }`;
      addBtn.innerText = `+ Add`;
      tabsHeader.appendChild(addBtn);

      // Render Screen Content
      const container = document.getElementById('active-screen-container');
      container.innerHTML = '';

      if (activeExerciseIdx === currentSessionLifts.length) {
        renderAddExerciseScreen(container);
      } else {
        renderActiveExerciseCard(container, currentSessionLifts[activeExerciseIdx], activeExerciseIdx);
      }
    }

    function renderActiveExerciseCard(container, lift, idx) {
      const altOptions = [lift.name, ...(EXERCISE_ALTERNATIVES[lift.name] || [])];
      
      // Look up performance history
      let prevRecord = "No previous records found";
      for (let entry of historyLogs) {
        if (entry.session_data && entry.session_data[lift.name]) {
          const sets = entry.session_data[lift.name];
          const wuSet = sets.find(s => s.set === 'Warmup');
          const workSets = sets.filter(s => s.set !== 'Warmup');
          
          if (workSets.length > 0) {
            const weight = workSets[0].weight;
            const reps = workSets.map(s => s.reps).join(', ');
            const wuInfo = wuSet ? ` | WU: ${wuSet.weight}lbs × ${wuSet.reps}` : '';
            prevRecord = `${entry.workout_date}: ${weight} lbs × [${reps}]${wuInfo}`;
            break;
          }
        }
      }

      const card = document.createElement('div');
      card.className = "bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-4 shadow-xl";
      card.innerHTML = `
        <div class="flex justify-between items-start border-b border-gray-700 pb-2">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider ${lift.isComp ? 'text-amber-400' : 'text-blue-400'}">
              ${lift.isComp ? '🔥 Compound Lift' : '⚡ Accessory Lift'}
            </span>
            <h2 class="text-xl font-bold text-white mt-0.5">${lift.name}</h2>
          </div>
          <span class="text-xs bg-gray-900 px-2 py-1 rounded text-gray-300 border border-gray-700">
            ${lift.sets} Sets | ${lift.reps} Reps
          </span>
        </div>

        <!-- Equipment Swapper -->
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Equipment Swapper (If Machine Occupied)</label>
          <select id="swap-select-${idx}" onchange="swapEquipment(${idx}, this.value)" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-400">
            ${altOptions.map(opt => `<option value="${opt}" ${opt === lift.name ? 'selected' : ''}>${opt}</option>`).join('')}
          </select>
        </div>

        <!-- History Banner -->
        <div class="bg-gray-900/80 p-2.5 rounded-lg border border-gray-700/60 text-xs text-amber-300/90">
          📌 <strong>Previous History:</strong> ${prevRecord}
        </div>

        <!-- Warmup Set Block (Compounds Only) -->
        ${lift.isComp ? `
          <div class="bg-amber-950/20 border border-amber-500/30 p-3 rounded-lg space-y-2">
            <span class="text-xs font-bold text-amber-400">🔥 Warm-Up Set (~50% Working Weight)</span>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-gray-400">Warmup Weight (lbs)</label>
                <input type="number" id="wu-weight-${idx}" placeholder="e.g. 95" value="${lift.wuWeight || ''}" onchange="lift.wuWeight=this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-400">
              </div>
              <div>
                <label class="block text-[10px] text-gray-400">Warmup Reps</label>
                <input type="number" id="wu-reps-${idx}" placeholder="e.g. 8" value="${lift.wuReps || ''}" onchange="lift.wuReps=this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-400">
              </div>
            </div>
          </div>
        ` : ''}

        <!-- Working Sets Block -->
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-300">Working Weight (lbs) for all ${lift.sets} sets:</label>
            <input type="number" id="working-weight-${idx}" step="2.5" placeholder="Weight in lbs" value="${lift.workWeight || ''}" onchange="lift.workWeight=this.value" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white mt-1 focus:outline-none focus:border-amber-400">
          </div>

          <div class="grid grid-cols-${lift.sets} gap-2">
            ${Array.from({length: lift.sets}).map((_, s) => `
              <div>
                <label class="block text-[10px] text-gray-400 text-center mb-1">Set ${s+1}</label>
                <input type="number" id="set-${idx}-${s}" placeholder="Reps" value="${(lift.savedSets && lift.savedSets[s]) || ''}" onchange="saveSetRep(${idx}, ${s}, this.value)" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-center text-white focus:outline-none focus:border-amber-400">
              </div>
            `).join('')}
          </div>
        </div>
      `;
      container.appendChild(card);
    }

    function renderAddExerciseScreen(container) {
      const card = document.createElement('div');
      card.className = "bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-4 shadow-xl";
      card.innerHTML = `
        <h2 class="text-xl font-bold text-amber-400 border-b border-gray-700 pb-2">➕ Add Extra Exercise</h2>
        <p class="text-xs text-gray-300">Extend your session by selecting a targeted accessory lift below:</p>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Suggested Lifts</label>
          <select id="custom-exercise-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
            ${SUGGESTED_EXTRA_EXERCISES.map(ex => `<option value="${ex}">${ex}</option>`).join('')}
          </select>
        </div>

        <button onclick="addCustomExercise()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-3 rounded-xl transition">
          + Insert Into Session
        </button>
      `;
      container.appendChild(card);
    }

    function swapEquipment(idx, newName) {
      currentSessionLifts[idx].name = newName;
      renderTabsAndScreen();
    }

    function saveSetRep(liftIdx, setIdx, val) {
      if (!currentSessionLifts[liftIdx].savedSets) currentSessionLifts[liftIdx].savedSets = {};
      currentSessionLifts[liftIdx].savedSets[setIdx] = val;
    }

    function addCustomExercise() {
      const selectedName = document.getElementById('custom-exercise-select').value;
      currentSessionLifts.push({
        name: selectedName,
        sets: 3,
        reps: "8-12",
        isComp: false
      });
      activeExerciseIdx = currentSessionLifts.length - 1;
      renderTabsAndScreen();
    }

    function prevExercise() {
      if (activeExerciseIdx > 0) {
        activeExerciseIdx--;
        renderTabsAndScreen();
      }
    }

    function nextExercise() {
      if (activeExerciseIdx < currentSessionLifts.length) {
        activeExerciseIdx++;
        renderTabsAndScreen();
      }
    }

    async function saveSession() {
      const split = document.getElementById('split-select').value;
      const option = document.getElementById('option-select').value;
      const sessionData = {};

      currentSessionLifts.forEach((lift, idx) => {
        const setsData = [];
        if (lift.isComp && lift.wuWeight) {
          setsData.push({ set: "Warmup", weight: parseFloat(lift.wuWeight) || 0, reps: parseInt(lift.wuReps) || 0 });
        }
        const workW = parseFloat(lift.workWeight) || 0;
        for (let s = 0; s < lift.sets; s++) {
          const repVal = (lift.savedSets && parseInt(lift.savedSets[s])) || 0;
          setsData.push({ set: s + 1, weight: workW, reps: repVal });
        }
        sessionData[lift.name] = setsData;
      });

      const today = new Date().toISOString().split('T')[0];

      try {
        const { error } = await supabaseClient.from('workout_logs').insert({
          workout_date: today,
          split_name: split,
          option_name: option,
          phase: "Phase 1",
          session_data: sessionData
        });

        if (error) throw error;
        alert("✅ Workout session saved to Supabase!");
        initApp();
      } catch (err) {
        alert(`⚠️ Save failed: ${err.message}`);
      }
    }

    window.onload = initApp;
  </script>
