<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>⚡ 30-Min Workout Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans pb-24">

  <div class="max-w-md mx-auto p-4 space-y-5">
    <!-- Header -->
    <header class="text-center py-1 border-b border-gray-800">
      <h1 class="text-2xl font-bold text-amber-400">⚡ 30-Min Workout Tracker</h1>
      <p id="status-bar" class="text-xs text-gray-400 mt-1">Connecting to database...</p>
    </header>

    <!-- Routine Configuration Controls -->
    <section class="bg-gray-800 p-3.5 rounded-xl shadow space-y-3 border border-gray-700">
      <div>
        <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Split Day</label>
        <select id="split-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-400" onchange="loadWorkoutTemplate()">
          <option value="Upper A (Chest / Back / Shoulders / Arms)">Upper A (Chest / Back / Shoulders / Arms)</option>
          <option value="Lower A (Quads / Hamstrings / Glutes / Calves)">Lower A (Quads / Hamstrings / Glutes / Calves)</option>
          <option value="Upper B (Chest / Back / Shoulders / Arms)">Upper B (Chest / Back / Shoulders / Arms)</option>
          <option value="Lower B (Quads / Hamstrings / Glutes / Core)">Lower B (Quads / Hamstrings / Glutes / Core)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Option</label>
          <select id="option-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-400" onchange="loadWorkoutTemplate()">
            <option value="Option 1">Option 1</option>
            <option value="Option 2">Option 2</option>
            <option value="Option 3">Option 3</option>
            <option value="Option 4">Option 4</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Environment</label>
          <select id="env-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-400" onchange="loadWorkoutTemplate()">
            <option value="Gym">Gym</option>
            <option value="Home">Home</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Single Page Exercise Cards Container -->
    <main id="workout-cards-container" class="space-y-4"></main>

    <!-- Dynamic Add Exercise Section -->
    <section class="bg-gray-800 p-4 rounded-xl border border-gray-700/80 space-y-3">
      <h3 class="text-sm font-bold text-amber-400 uppercase tracking-wider">➕ Add Extra Exercise</h3>
      <div class="flex gap-2">
        <select id="custom-exercise-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-400">
          <option value="Cable Lateral Raise">Cable Lateral Raise</option>
          <option value="Dumbbell Lateral Raise">Dumbbell Lateral Raise</option>
          <option value="Cable Face Pull">Cable Face Pull</option>
          <option value="Machine Rear Delt Fly (Reverse Pec Deck)">Machine Rear Delt Fly</option>
          <option value="Cable Bicep Curl">Cable Bicep Curl</option>
          <option value="Dumbbell Hammer Curl">Dumbbell Hammer Curl</option>
          <option value="Cable Tricep Pushdown">Cable Tricep Pushdown</option>
          <option value="Overhead Cable Tricep Extension">Overhead Cable Tricep Extension</option>
          <option value="Heavy Cable Crunch">Heavy Cable Crunch</option>
          <option value="Hanging Leg Raise">Hanging Leg Raise</option>
          <option value="Seated Calf Raise (Machine)">Seated Calf Raise</option>
          <option value="Leg Extension Machine">Leg Extension Machine</option>
          <option value="Hip Abductor Machine">Hip Abductor Machine</option>
        </select>
        <button onclick="addCustomExercise()" class="bg-gray-700 hover:bg-gray-600 text-amber-400 font-bold px-4 py-2 rounded-lg text-xs border border-gray-600 whitespace-nowrap">
          + Add
        </button>
      </div>
    </section>

    <!-- Save Button -->
    <button onclick="saveSession()" class="w-full bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-gray-900 font-bold py-3.5 rounded-xl shadow-lg transition text-base">
      💾 Save Workout Session
    </button>
  </div>

  <script>
